<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threadwork — Follow the golden thread</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Suppress React Flow's default selection outline */
      .react-flow__node.selected,
      .react-flow__node.selected .react-flow__handle { outline: none !important; box-shadow: none !important; }
      .react-flow__node.tw-selected { outline: none !important; }
      @keyframes dash-flow { to { stroke-dashoffset: -12; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
